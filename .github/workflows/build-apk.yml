name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore release keystore from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/animaltap-release.jks
          {
            echo "storeFile=animaltap-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=animaltap"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Build debug and release APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AnimalTap-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/AnimalTap.apk
          fi
          if [ -f keystore.properties ] && [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab dist/AnimalTap.aab   # upload this to Google Play
          fi
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: AnimalTap-apk
          path: |
            dist/*.apk
            dist/*.aab

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
